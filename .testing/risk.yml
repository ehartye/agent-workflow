# agent-tests risk map. Confirm or edit, then commit it.
# First matching area wins, so list specific areas before broad ones.
# consumers: who depends on this code, and which compatibility obligations exist?
# Current missing/invalid-input handling can need coverage without legacy consumers.
phase: production
consumers:
  - Codex plugin installations
  - Saved workflows and commands
  - Persisted runs
  - Retained prior runtime directories and saved data
weights:
  wait: 1
  agent: 1
  ci: 1
  churn: 1
lanes:
  edit:
    runs: affected-files
    trigger: agent-edit
  merge:
    runs: critical+standard
    trigger: local-pre-push
  scheduled:
    runs: all
    trigger: cron
    os:
      - windows
  release:
    runs: all+clean-install
    trigger: tag
    os:
      - windows
areas:
  - path: engine/monitor/style.css
    tier: low
    why: Styling and theme presentation.
  - path: engine/mode.mjs
    tier: standard
    why: Explicit routing preference stays scoped and grants no worker permissions.
  - path: engine/**
    tier: critical
    why: Workflow isolation, dispatch, persisted replay and authenticated monitor protect execution and user data.
  - path: foundation/**
    tier: critical
    why: Native admission, authentication and retained process ownership must fail closed.
  - path: bin/**
    tier: critical
    why: Setup, upgrades and CLI select verified runtimes and preserve session/data ownership.
  - path: hooks/**
    tier: standard
    why: Hook routing and host trust are distinct from installation.
  - path: skills/**
    tier: standard
    why: Authoring and control instructions guide saved workflow consumers.
  - path: workflows/**
    tier: standard
    why: Bundled recipes preserve failed slots and unsupported evidence.
  - path: scripts/**
    tier: standard
    why: Packaging, smoke and installation helpers supply release evidence.
  - path: docs/**
    tier: low
    why: Documentation needs accurate release review.
  - path: '*.md'
    tier: low
    why: Repository documentation.
  - path: LICENSES/**
    tier: low
    why: Third-party attribution documents.
  - path: reports/**
    tier: low
    why: Reviewed verification evidence, not executable runtime inputs.
